<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schulplaner</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--accent:#3b82f6;--red:#ef4444;--green:#10b981}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.app{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:76px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 9px;z-index:5}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:white;display:grid;place-items:center;font-weight:900;font-size:23px;margin-bottom:22px}
.nav{display:grid;gap:8px;width:100%}
.nav button{height:48px;border:0;border-radius:14px;background:transparent;font-size:21px;color:#64748b;cursor:pointer;transition:all .2s}
.nav button.active,.nav button:hover{background:#334155;color:var(--accent)}
.main{margin-left:76px;max-width:1250px;padding:26px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.top h1{margin:0;font-size:27px;font-weight:800}
.user{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.title h2{margin:0;font-size:19px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.lesson,.box{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.lesson strong{display:block;margin:4px 0;font-size:16px;color:white}
.tasks{display:grid;gap:10px}
.task{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--bg)}
.task.urgent{background:#3f1d1d;border-color:#ef4444}
.task.done{opacity:.5;text-decoration:line-through}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #64748b;background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:bold;transition:all .2s}
.check.on{background:var(--green);color:white;border-color:var(--green)}
.taskmain{flex:1}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;background:#334155;font-size:11px;font-weight:700;color:white}
.badge.red{background:#7f1d1d;color:#fca5a5}
.badge.group{background:#1e3a8a;color:#93c5fd}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:700;background:#334155;color:white;cursor:pointer;transition:all .2s}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--accent);color:white}
.btn.green{background:#064e3b;color:#34d399}
.btn.red{background:#7f1d1d;color:#f87171}
.btn.small{padding:7px 12px;font-size:12px}
.form{display:grid;gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:white;font:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.two{grid-template-columns:1fr 1fr}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,0.02)}
.day{margin:0 0 16px}
.day h3{font-size:14px;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px}
.pack{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:12px;border-radius:14px;background:var(--bg)}
.pack.done{opacity:.5;text-decoration:line-through}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.group{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--bg)}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,0.85);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--card);border-radius:24px;padding:26px;width:min(500px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 50px rgba(0,0,0,0.5);border:1px solid var(--line)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#1e293b,var(--bg))}
.authbox{width:min(440px,100%);background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.4);border:1px solid var(--line)}
.authform{padding:40px}
.authform h2{margin:0 0 10px;font-size:24px}
.link{background:none;border:0;color:var(--accent);font-weight:750;cursor:pointer;padding:0}
.msg{padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px;font-weight:600}
.err{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b}
.ok{background:#064e3b;color:#34d399;border:1px solid #065f46}
.messages{height:55vh;overflow:auto;background:var(--bg);border-radius:16px;padding:14px;border:1px solid var(--line)}
.message{max-width:80%;padding:10px 14px;border-radius:16px;background:#334155;margin:8px 0;color:white}
.message.mine{margin-left:auto;background:var(--accent);color:white}
.message small{display:block;opacity:0.7;font-size:11px;margin-bottom:4px}
.message img{max-width:100%;border-radius:10px;margin-top:8px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--accent);font-weight:bold;font-size:20px;background:var(--bg)}
@media(max-width:750px){.side{width:68px}.main{margin-left:68px;padding:18px}.two{grid-template-columns:1fr}.top h1{font-size:22px}}
</style>
</head>
<body>
<div id="root"><div class="loading">Lädt Systeme...</div></div><div id="modal"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,orderBy,limitToLast,onSnapshot,serverTimestamp,arrayUnion}from'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyDufHoBggthiPADhYfpNN6Q6ZGH1FNooD0",
  authDomain:"schulplaner-lenny.firebaseapp.com",
  projectId:"schulplaner-lenny",
  storageBucket:"schulplaner-lenny.firebasestorage.app",
  messagingSenderId:"1043062762648",
  appId:"1:1043062762648:web:c9b1eb13954025fc42b4ed"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

setPersistence(auth, browserLocalPersistence).catch(console.error);

const S={u:null,ud:null,view:'home',classes:[],cls:null,lessons:[],hw:[],pack:[],groups:[],gm:new Set(),inv:[],chat:null,stop:null,mode:'login'};
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),add=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},wd=d=>new Date(d+'T12:00:00').getDay(),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit'});

function err(e){return esc(e?.message||e)}
function sys(){return!!S.ud?.systemAdmin}
function cad(){return sys()||!!S.cls?.adminIds?.includes(S.u.uid)}
function stopChat(){if(S.stop){S.stop();S.stop=null}}

function authPage(){
  let l=S.mode==='login';
  $('root').innerHTML=`<div class=auth><div class=authbox><div class=authform>
  <h2>${l?'Willkommen zurück':'Konto erstellen'}</h2>
  <p class=muted>${l?'Melde dich an, um deinen Schulplaner zu öffnen.':'Erstelle dir direkt einen Account.'}</p>
  <form id=af class=form>
    ${!l?'<div class=field><label>Name</label><input id=name required></div>':''}
    <div class=field><label>E-Mail</label><input id=email type=email required></div>
    <div class=field><label>Passwort</label><input id=pw type=password minlength=6 required></div>
    ${!l?'<div class=field><label>Passwort wiederholen</label><input id=pw2 type=password minlength=6 required></div>':''}
    <div id=am></div>
    <button class="btn primary" style="width:100%;margin-top:10px;height:46px;font-size:16px">${l?'Anmelden':'Konto erstellen'}</button>
  </form>
  <p class=muted style="text-align:center;margin-top:20px">${l?'Noch kein Konto?':'Schon registriert?'} <button class=link id=sw>${l?'Konto erstellen':'Anmelden'}</button></p>
  </div></div></div>`;
  $('sw').onclick=()=>{S.mode=l?'register':'login';authPage()};
  $('af').onsubmit=async e=>{
    e.preventDefault();
    try{
      let email=$('email').value.trim(),pw=$('pw').value;
      $('am').innerHTML='<div class="msg ok">Lädt...</div>';
      if(l)await signInWithEmailAndPassword(auth,email,pw);
      else{
        if(pw!==$('pw2').value)throw Error('Die Passwörter stimmen nicht überein.');
        let r=await createUserWithEmailAndPassword(auth,email,pw);
        let name=$('name').value.trim();
        await setDoc(doc(db,'users',r.user.uid),{name,email,systemAdmin:false,packMode:'evening',createdAt:serverTimestamp()});
        await setDoc(doc(db,'profiles',r.user.uid),{name,email});
      }
    }catch(e){$('am').innerHTML=`<div class="msg err">${err(e)}</div>`}
  }
}

async function load(){
  try{
    let us=await getDoc(doc(db,'users',S.u.uid));
    S.ud=us.data();
    // NOTFALL-RETTUNG: Wenn Nutzer in der Datenbank fehlt (Fehler beim Registrieren), Account sauber ausloggen.
    if(!S.ud){
      await signOut(auth);
      return;
    }
    let a=await getDocs(query(collection(db,'classes'),where('memberIds','array-contains',S.u.uid))),b=await getDocs(query(collection(db,'classes'),where('adminIds','array-contains',S.u.uid))),m=new Map();
    [...a.docs,...b.docs].forEach(d=>m.set(d.id,{id:d.id,...d.data()}));
    S.classes=[...m.values()];
    S.cls=S.classes.find(x=>x.id===localStorage.cls)||S.classes[0]||null;
    if(S.cls)localStorage.cls=S.cls.id;else localStorage.removeItem('cls');
    await classData();
    render();
  } catch(e) {
    $('root').innerHTML=`<div class=auth><div class=card><h2>Systemfehler</h2><div class="msg err">${err(e)}</div><button class="btn red" id=loErr>Ausloggen</button></div></div>`;
    $('loErr').onclick=()=>signOut(auth);
  }
}

async function classData(){
  S.lessons=[];S.hw=[];S.pack=[];S.groups=[];S.gm=new Set();S.inv=[];
  if(!S.cls){
    let i=await getDocs(query(collection(db,'groupInvites'),where('toUid','==',S.u.uid)));
    S.inv=i.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
    return;
  }
  let c=S.cls.id;
  let [l,h,p,g,i]=await Promise.all([getDocs(collection(db,'classes',c,'lessons')),getDocs(collection(db,'users',S.u.uid,'homework')),getDocs(collection(db,'users',S.u.uid,'pack')),getDocs(query(collection(db,'groups'),where('classId','==',c))),getDocs(query(collection(db,'groupInvites'),where('toUid','==',S.u.uid)))]);
  S.lessons=l.docs.map(d=>({id:d.id,...d.data()}));
  S.hw=h.docs.map(d=>({id:d.id,scope:'personal',...d.data()}));
  S.pack=p.docs.map(d=>({id:d.id,...d.data()}));
  S.groups=g.docs.map(d=>({id:d.id,...d.data()}));
  S.inv=i.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
  for(let x of S.groups){if((await getDoc(doc(db,'groups',x.id,'members',S.u.uid))).exists())S.gm.add(x.id)}
  for(let x of S.groups.filter(x=>S.gm.has(x.id))){
    let h=await getDocs(collection(db,'groups',x.id,'homework'));
    h.forEach(d=>S.hw.push({id:d.id,scope:'group',groupId:x.id,groupName:x.name,...d.data()}));
  }
}

function nextLesson(subject,from=today()){
  for(let n=0;n<14;n++){
    let d=add(from,n),w=wd(d);
    let l=S.lessons.filter(x=>Number(x.weekday)===w-1).sort((a,b)=>a.period-b.period).find(x=>x.subject?.trim().toLowerCase()===subject?.trim().toLowerCase());
    if(l)return{date:d,l};
  }
  return null;
}
function getDueDate(subject){let n=nextLesson(subject);return n?n.date:'9999'}
function urgent(h){if(h.done)return false;let n=nextLesson(h.subject);return n&&(n.date===today()||n.date===add(today(),1))}
function task(h){let d=getDueDate(h.subject);return`<div class="task ${urgent(h)?'urgent':''} ${h.done?'done':''}"><button class="check ${h.done?'on':''}" data-check="${h.scope}|${h.groupId||''}|${h.id}" data-on="${!!h.done}">${h.done?'✓':''}</button><div class=taskmain><b>${esc(h.subject)} – ${esc(h.task)}</b><div class=muted>${d!=='9999'?fmt(d):'Nächste Stunde nicht im Plan'} · <span class="badge ${h.scope==='group'?'group':''}">${h.scope==='group'?'👥 '+esc(h.groupName):'Persönlich'}</span></div></div></div>`}
function bindChecks(){document.querySelectorAll('[data-check]').forEach(b=>b.onclick=async()=>{let[a,g,id]=b.dataset.check.split('|'),nowDone=b.dataset.on!=='true';await updateDoc(a==='personal'?doc(db,'users',S.u.uid,'homework',id):doc(db,'groups',g,'homework',id),{done:nowDone});await load()})}
function packDueTomorrow(x){return x.date===add(today(),1)||x.repeatDays?.includes(wd(add(today(),1)))}
function packDueToday(x){return x.date===today()||x.repeatDays?.includes(wd(today()))}
function packForNow(list){return list.filter(x=>(x.mode==='morning'&&packDueToday(x))||(x.mode!=='morning'&&packDueTomorrow(x)))}

function home(){let d=today(),ls=S.lessons.filter(x=>Number(x.weekday)===wd(d)-1).sort((a,b)=>a.period-b.period),due=S.hw.filter(urgent),rest=S.hw.filter(x=>!x.done&&!urgent(x)),p=packForNow(S.pack);$('content').innerHTML=`<div class=card><div class=title><h2>📅 ${fmt(d)}</h2><span class=badge>${S.cls?esc(S.cls.name):'Keine Klasse'}</span></div>${ls.length?`<div class=grid>${ls.map(x=>`<div class=lesson><small style="color:var(--muted)">${x.period}. Stunde · ${esc(x.time||'')}</small><strong>${esc(x.subject)}</strong><small style="color:var(--muted)">${esc(x.teacher||'')} ${esc(x.room||'')}</small></div>`).join('')}</div>`:'<div class=empty>Kein Stundenplan für heute.</div>'}</div><div class=card><div class=title><h2>🔴 Jetzt fällig</h2><span class="badge red">${due.length}</span></div>${due.length?`<div class=tasks>${due.map(task).join('')}</div>`:'<div class=empty>Alles erledigt.</div>'}</div><div class=card><div class=title><h2>📚 Weitere Hausaufgaben</h2><button class="btn primary" id=ah>+ Hausaufgabe</button></div>${grouped(rest)}</div><div class=card><div class=title><h2>🎒 Packen</h2><button class="btn primary" id=ap>+ Sache</button></div>${p.length?`<div class=tasks>${p.map(pack).join('')}</div>`:'<div class=empty>Nichts zu packen für jetzt.</div>'}</div>`;$('ah').onclick=()=>hwModal();$('ap').onclick=()=>packModal();bindChecks()}
function grouped(a){if(!a.length)return'<div class=empty>Keine weiteren offenen Aufgaben.</div>';let m={};a.forEach(x=>{let d=getDueDate(x.subject);(m[d]??=[]).push(x)});return Object.keys(m).sort().map(k=>`<div class=day><h3>${k==='9999'?'Ohne Datum im Plan':fmt(k)}</h3><div class=tasks>${m[k].map(task).join('')}</div></div>`).join('')}
function pack(p){return`<div class="pack ${p.done?'done':''}"><button class="check ${p.done?'on':''}" data-pack="${p.id}" data-on="${!!p.done}" data-scope="${p.scope||'personal'}">${p.done?'✓':''}</button><div><b>${esc(p.item)}</b><div class=muted>${p.repeatDays?.length?'Wiederholt: '+p.repeatDays.map(x=>['So','Mo','Di','Mi','Do','Fr','Sa'][x]).join(', '):p.date?fmt(p.date):'Einmalig'} · ${p.mode==='morning'?'morgens':'abends vorher'}</div></div></div>`}
function bindPack(){document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=async()=>{let nowDone=b.dataset.on!=='true';await updateDoc(doc(db,'users',S.u.uid,'pack',b.dataset.pack),{done:nowDone});await load()})}
function personal(){$('content').innerHTML=`<div class=card><div class=title><h2>👤 Persönlich</h2><div class=actions><button class="btn primary" id=ph>+ Hausaufgabe</button><button class="btn primary" id=pp>+ Packliste</button></div></div><p class=muted>Nur du kannst diese Inhalte sehen.</p></div><div class=card><h2>Hausaufgaben</h2>${grouped(S.hw.filter(x=>x.scope==='personal'&&!x.done))}</div><div class=card><h2>Packliste</h2><div class=tasks>${S.pack.map(pack).join('')||'<div class=empty>Noch nichts.</div>'}</div></div>`;$('ph').onclick=()=>hwModal();$('pp').onclick=()=>packModal();bindChecks();bindPack()}
function groups(){stopChat();if(!S.cls){$('content').innerHTML='<div class=card><div class=empty>Wähle zuerst eine Klasse.</div></div>';return}let gs=S.groups.filter(g=>S.gm.has(g.id));$('content').innerHTML=`<div class=card><div class=title><h2>👥 Gruppen</h2><button class="btn primary" id=ng>+ Gruppe</button></div>${gs.length?`<div class=groups>${gs.map(g=>`<div class=group><h3 style="margin-top:0">${esc(g.name)}</h3><p class=muted>${esc(g.description||'Gemeinsamer Bereich')}</p><button class="btn primary" data-g="${g.id}" style="width:100%">Öffnen</button></div>`).join('')}</div>`:'<div class=empty>Du bist in keiner Gruppe.</div>'}</div>`;$('ng').onclick=groupModal;document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.chat=b.dataset.g;groupView()})}
function groupView(){let g=S.groups.find(x=>x.id===S.chat);$('content').innerHTML=`<div class=card><div class=title><h2>👥 ${esc(g.name)}</h2><button class=btn id=back>← Gruppen</button></div><div class=actions><button class=btn id=gc>💬 Chat</button><button class=btn id=gh>✓ Hausaufgaben</button><button class=btn id=gp>🎒 Packliste</button><button class=btn id=gmm>Mitglieder</button></div><div id=gpane style="margin-top:20px"></div></div>`;$('back').onclick=()=>{stopChat();S.chat=null;groups()};$('gc').onclick=()=>chat();$('gh').onclick=()=>{stopChat();groupHw()};$('gp').onclick=()=>{stopChat();groupPack()};$('gmm').onclick=()=>{stopChat();members()};chat()}
function chat(){let g=S.chat;stopChat();$('gpane').innerHTML=`<div class=messages id=msgs></div><form id=cf class=actions style="margin-top:12px;display:flex;gap:10px"><input id=ct style="flex:1;min-width:180px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:white" maxlength=5000 placeholder="Nachricht…"><label class="btn" style="cursor:pointer;display:grid;place-items:center">📷<input id=ci type=file accept="image/*" style="display:none"></label><button class="btn primary">Senden</button></form>`;S.stop=onSnapshot(query(collection(db,'groups',g,'messages'),orderBy('createdAt','asc'),limitToLast(100)),s=>{$('msgs').innerHTML=s.docs.map(d=>{let x=d.data();return`<div class="message ${x.uid===S.u.uid?'mine':''}"><small>${esc(x.name||'Mitglied')}</small>${esc(x.text||'')}${x.imageData?`<img src="${x.imageData}">`:''}</div>`}).join('')||'<div class=empty>Noch keine Nachrichten.</div>';$('msgs').scrollTop=$('msgs').scrollHeight});$('cf').onsubmit=async e=>{e.preventDefault();let text=$('ct').value.trim(),f=$('ci').files[0],btn=e.target.querySelector('button.primary');btn.disabled=true;btn.textContent='Sendet...';try{let img=f?await imageData(f):null;if(!text&&!img)return;await addDoc(collection(db,'groups',g,'messages'),{uid:S.u.uid,name:S.ud.name,text,imageData:img,createdAt:serverTimestamp()});$('ct').value='';$('ci').value=''}catch(e){alert(err(e))}finally{btn.disabled=false;btn.textContent='Senden'}}}
async function imageData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q=.58,dd=c.toDataURL('image/jpeg',q);while(dd.length>350000&&q>.2){q-=.05;dd=c.toDataURL('image/jpeg',q)}dd.length>350000?rej(Error('Bild ist zu groß.')):res(dd)};i.onerror=()=>rej(Error('Fehler beim Bild.'));i.src=r.result};r.onerror=()=>rej(Error('Datei nicht lesbar.'));r.readAsDataURL(f)})}
function groupHw(){let hs=S.hw.filter(x=>x.scope==='group'&&x.groupId===S.chat&&!x.done);$('gpane').innerHTML=`<div class=title><h3>Geteilte Hausaufgaben</h3><button class="btn primary" id=x>+ Aufgabe</button></div>${hs.length?`<div class=tasks>${hs.map(task).join('')}</div>`:'<div class=empty>Keine offenen Aufgaben.</div>'}`;$('x').onclick=()=>hwModal(S.chat);bindChecks()}
async function groupPack(){let s=await getDocs(collection(db,'groups',S.chat,'pack')),items=s.docs.map(d=>({id:d.id,scope:'group',...d.data()}));$('gpane').innerHTML=`<div class=title><h3>Geteilte Packliste</h3><button class="btn primary" id=x>+ Sache</button></div><div class=tasks id=gplist>${items.map(pack).join('')||'<div class=empty>Noch nichts.</div>'}</div>`;$('x').onclick=()=>packModal(S.chat);document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=async()=>{let nowDone=b.dataset.on!=='true';await updateDoc(doc(db,'groups',S.chat,'pack',b.dataset.pack),{done:nowDone});groupPack()})}
async function members(){let s=await getDocs(collection(db,'groups',S.chat,'members'));let rows=await Promise.all(s.docs.map(async d=>{let p=await getDoc(doc(db,'profiles',d.id));return{name:p.data()?.name||d.id,id:d.id,role:d.data().role}}));$('gpane').innerHTML=`<div class=title><h3>Mitglieder</h3><button class="btn primary" id=iv>+ Einladen</button></div>${rows.map(x=>`<div class=box style="margin:7px 0"><b>${esc(x.name)}</b><div class=muted>${x.role==='admin'?'Gruppenadmin':'Mitglied'}</div></div>`).join('')}`;$('iv').onclick=()=>inviteModal()}
function inbox(){$('content').innerHTML=`<div class=card><div class=title><h2>💬 Nachrichten</h2><span class="badge ${S.inv.length?'group':''}">${S.inv.length} offen</span></div><p class=muted>Einladungen erscheinen hier.</p>${S.inv.map(i=>`<div class=box><b>👥 ${esc(i.groupName)}</b><p>${esc(i.fromName)} möchte dich einladen.</p><div class=actions><button class="btn green" data-ai="${i.id}">Annehmen</button><button class="btn red" data-di="${i.id}">Ablehnen</button></div></div>`).join('')||'<div class=empty>Keine neuen Einladungen.</div>'}</div>`;document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>answer(b.dataset.ai,true));document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>answer(b.dataset.di,false))}
async function answer(id,yes){let i=S.inv.find(x=>x.id===id);await updateDoc(doc(db,'groupInvites',id),{status:yes?'accepted':'declined',answeredAt:serverTimestamp()});if(yes)await setDoc(doc(db,'groups',i.groupId,'members',S.u.uid),{uid:S.u.uid,role:'member',joinedAt:serverTimestamp()});await load();S.view='inbox';render()}
function timetable(){let d=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];$('content').innerHTML=`<div class=card><div class=title><h2>📅 ${esc(S.cls?.name||'Stundenplan')}</h2><button class=btn id=cc>Klasse wechseln</button></div>${S.cls?d.map((x,i)=>`<div class=box style="margin:9px 0"><b>${x}</b>${S.lessons.filter(l=>Number(l.weekday)===i).sort((a,b)=>a.period-b.period).map(l=>`<div style="padding:10px 0;border-top:1px solid var(--line);margin-top:8px">${l.period}. ${esc(l.subject)} <span class=muted style="margin-left:8px">${esc(l.time||'')} ${esc(l.teacher||'')} ${esc(l.room||'')}</span></div>`).join('')||'<div class=muted style="padding-top:10px">Keine Einträge</div>'}</div>`).join(''):'<div class=empty>Keine Klasse gewählt.</div>'}</div>`;$('cc').onclick=classModal}
function admin(){let h='';if(S.cls&&cad()){h+=`<div class=card><h2>👋 Beitrittsanfragen für ${esc(S.cls.name)}</h2><div id=joinReqs>Lade...</div></div><div class=card><h2>⚙️ Stundenplan & Verwaltung</h2><button class="btn primary" id=nl>+ Stunde hinzufügen</button><div style="margin-top:16px">${S.lessons.map(l=>`<div class=box style="margin:8px 0;display:flex;justify-content:space-between;align-items:center"><div><b>${l.period}. ${esc(l.subject)}</b><br><span class=muted>${esc(l.teacher||'')} · ${esc(l.room||'')}</span></div><button class="btn red small" data-dl="${l.id}">Löschen</button></div>`).join('')||'<div class=muted>Noch keine Stunden.</div>'}</div></div>`}$('content').innerHTML=h||'<div class=card><div class=empty>Keine Verwaltung verfügbar.</div></div>';if(S.cls&&cad()){getDocs(query(collection(db,'joinRequests'),where('classId','==',S.cls.id),where('status','==','pending'))).then(s=>{$('joinReqs').innerHTML=s.docs.map(d=>{let x=d.data();return`<div class=box style="margin:6px 0"><b>${esc(x.name)}</b> möchte beitreten. <div class="actions" style="margin-top:8px"><button class="btn green small" data-ajr="${d.id}" data-uid="${x.uid}">Annehmen</button> <button class="btn red small" data-rjr="${d.id}">Ablehnen</button></div></div>`}).join('')||'<div class=muted>Keine offenen Anfragen.</div>';document.querySelectorAll('[data-ajr]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'classes',S.cls.id),{memberIds:arrayUnion(b.dataset.uid)});await updateDoc(doc(db,'joinRequests',b.dataset.ajr),{status:'approved'});admin()});document.querySelectorAll('[data-rjr]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'joinRequests',b.dataset.rjr),{status:'rejected'});admin()})});$('nl').onclick=lessonModal;document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,'classes',S.cls.id,'lessons',b.dataset.dl));await classData();admin()})}}

function render(){
  if(!S.u){authPage();return}
  if(S.classes.length===0){
    $('root').innerHTML=`<div class=auth><div class=card style="text-align:center;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.4)"><h2>Willkommen im Schulplaner!</h2><p class=muted>Du musst zuerst einer Klasse beitreten oder eine neue erstellen.</p><div class=actions style="justify-content:center;margin-top:20px"><button class="btn primary" id=btnJoin>Klasse beitreten</button><button class=btn id=btnCreate>Klasse erstellen</button></div><div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line)"><button class="btn red small" id=btnLo>Abmelden</button></div></div></div>`;
    $('btnJoin').onclick=joinClassModal;$('btnCreate').onclick=createClassModal;$('btnLo').onclick=()=>signOut(auth);
    return;
  }
  let nav=[['home','🏠'],['timetable','📅'],['homework','✓'],['pack','🎒'],['personal','👤'],['groups','👥'],['inbox','💬'],...(sys()||cad()?[['admin','⚙️']]:[])];
  $('root').innerHTML=`<div class=app><aside class=side><div class=logo>S</div><div class=nav>${nav.map(x=>`<button data-v="${x[0]}" class="${x[0]===S.view?'active':''}">${x[1]}</button>`).join('')}</div></aside><main class=main><div class=top><div><h1>${({home:'Heute',timetable:'Stundenplan',homework:'Hausaufgaben',pack:'Packliste',personal:'Persönlich',groups:'Gruppen',inbox:'Nachrichten',admin:'Verwaltung'})[S.view]}</h1><span class=badge>${S.cls?esc(S.cls.name):'Keine Klasse'}</span></div><div class=user>${esc(S.ud.name||S.ud.email)} <button class="btn small" id=topClassBtn>Wechseln</button><button class="btn small red" id=logoutBtn>Abmelden</button></div></div><div id=content></div></main></div>`;
  document.querySelectorAll('[data-v]').forEach(b=>{b.onclick=async()=>{stopChat();S.chat=null;S.view=b.dataset.v;render()}});
  $('topClassBtn').onclick=classModal;$('logoutBtn').onclick=()=>{stopChat();signOut(auth)};
  if(S.view==='home')home();if(S.view==='timetable')timetable();
  if(S.view==='homework'){$('content').innerHTML=`<div class=card><div class=title><h2>Meine Hausaufgaben</h2><button class="btn primary" id=ah>+ Hausaufgabe</button></div>${grouped(S.hw.filter(x=>x.scope==='personal'&&!x.done))}</div>`;$('ah').onclick=()=>hwModal();bindChecks()}
  if(S.view==='pack'){$('content').innerHTML=`<div class=card><div class=title><h2>Meine Packliste</h2><button class="btn primary" id=ap>+ Sache</button></div><p class=muted>Wiederholungen sind möglich, z. B. Mathebuch jeden Montag.</p><div class=tasks>${S.pack.map(pack).join('')||'<div class=empty>Noch nichts.</div>'}</div></div><div class=card><h3>Standard-Erinnerung</h3><div class=actions><button class="btn ${S.ud.packMode==='morning'?'primary':''}" id=morning>Morgens</button><button class="btn ${S.ud.packMode!=='morning'?'primary':''}" id=evening>Abends vorher</button></div></div>`;$('ap').onclick=()=>packModal();$('morning').onclick=async()=>{await updateDoc(doc(db,'users',S.u.uid),{packMode:'morning'});load()};$('evening').onclick=async()=>{await updateDoc(doc(db,'users',S.u.uid),{packMode:'evening'});load()};bindPack()}
  if(S.view==='personal')personal();if(S.view==='groups')groups();if(S.view==='inbox')inbox();if(S.view==='admin')admin();
}

function modal(title,body,cb){$('modal').innerHTML=`<div class=modalbg><div class=modal><div class=title><h2 style="margin:0">${title}</h2><button class=btn id=mx style="background:transparent;color:var(--muted);font-size:20px;padding:0">✕</button></div>${body}</div></div>`;$('mx').onclick=()=>$('modal').innerHTML='';cb?.()}
function hwModal(gid=null){let subs=[...new Set(S.lessons.map(l=>l.subject))];let subHtml=subs.length?`<select id=s required>${subs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`:`<input id=s required placeholder="Noch keine Fächer im Stundenplan">`;modal(gid?'Gruppen-Hausaufgabe':'Hausaufgabe',`<form id=f class=form><div class=field><label>Fach (wird aus Plan geladen)</label>${subHtml}</div><div class=field><label>Aufgabe / Seiten</label><textarea id=t required rows=3></textarea></div><button class="btn primary" style="margin-top:10px">Speichern</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let x={subject:$('s').value.trim(),task:$('t').value.trim(),done:false,ownerId:S.u.uid,createdAt:serverTimestamp()};if(gid)await addDoc(collection(db,'groups',gid,'homework'),x);else await addDoc(collection(db,'users',S.u.uid,'homework'),x);$('modal').innerHTML='';gid?groupHw():load()}})}
function packModal(gid=null){modal(gid?'Geteilte Gruppen-Packliste':'Meine Packliste',`<form id=f class=form><div class=field><label>Sache</label><input id=i required placeholder="z. B. Mathebuch"></div><div class=field><label>Einmalig am (optional)</label><input id=d type=date></div><div class=field><label>Wiederholung</label><div class=actions>${['So','Mo','Di','Mi','Do','Fr','Sa'].map((x,i)=>`<label class="btn small" style="cursor:pointer;display:flex;align-items:center;gap:6px"><input type=checkbox class=day value=${i}> ${x}</label>`).join('')}</div></div><div class=field><label>Erinnerung</label><select id=m><option value=evening ${S.ud.packMode!=='morning'?'selected':''}>Abends vorher</option><option value=morning ${S.ud.packMode==='morning'?'selected':''}>Morgens am selben Tag</option></select></div><button class="btn primary" style="margin-top:10px">Speichern</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let x={item:$('i').value.trim(),date:$('d').value||null,repeatDays:[...document.querySelectorAll('.day:checked')].map(x=>+x.value),mode:$('m').value,done:false,ownerId:S.u.uid,createdAt:serverTimestamp()};await addDoc(collection(db,gid?'groups/'+gid+'/pack':'users/'+S.u.uid+'/pack'),x);$('modal').innerHTML='';gid?groupPack():load()}})}
function groupModal(){modal('Neue Gruppe',`<form id=f class=form><div class=field><label>Gruppen-Name</label><input id=n required></div><div class=field><label>Beschreibung</label><input id=d></div><button class="btn primary" style="margin-top:10px">Erstellen</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let r=doc(collection(db,'groups'));await setDoc(r,{classId:S.cls.id,name:$('n').value.trim(),description:$('d').value.trim(),adminIds:[S.u.uid],createdBy:S.u.uid,createdAt:serverTimestamp()});await setDoc(doc(db,'groups',r.id,'members',S.u.uid),{uid:S.u.uid,role:'admin',joinedAt:serverTimestamp()});$('modal').innerHTML='';await load();S.chat=r.id;groupView()}})}
async function inviteModal(){let ids=(S.cls.memberIds||[]).filter(x=>x!==S.u.uid),ps=await Promise.all(ids.map(async id=>{let p=await getDoc(doc(db,'profiles',id));return{id,name:p.data()?.name||id}}));modal('Person einladen',ps.length?`<form id=f class=form><div class=field><label>Klassenmitglied</label><select id=t>${ps.map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select></div><div id=e></div><button class="btn primary" style="margin-top:10px">Einladung senden</button></form>`:'<div class=empty>Niemand sonst ist in deiner Klasse.</div>',()=>{if(!$('f'))return;$('f').onsubmit=async e=>{e.preventDefault();let to=$('t').value,id=S.chat+'_'+to,btn=e.target.querySelector('button');btn.disabled=true;try{let old=await getDoc(doc(db,'groupInvites',id));if(old.exists()&&old.data().status==='pending')throw Error('Diese Person hat bereits eine offene Einladung.');await setDoc(doc(db,'groupInvites',id),{classId:S.cls.id,groupId:S.chat,groupName:S.groups.find(x=>x.id===S.chat).name,toUid:to,fromUid:S.u.uid,fromName:S.ud.name,status:'pending',createdAt:serverTimestamp()});$('modal').innerHTML='';alert('Einladung versendet!');}catch(x){$('e').innerHTML=`<div class="msg err">${err(x)}</div>`;btn.disabled=false}}})}
function classModal(){modal('Klasse auswählen / Beitreten',`<div class=groups>${S.classes.map(c=>`<div class=group><h3>${esc(c.name)}</h3><p class=muted>ID: ${c.id}</p><button class="btn primary" data-c=${c.id} style="width:100%">Auswählen</button></div>`).join('')||'<div class=empty>Du bist noch keiner Klasse beigetreten.</div>'}</div><div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--line)"><h3>Optionen</h3><div class=actions><button class="btn primary" id=btnCreateClass>+ Klasse erstellen</button><button class=btn id=btnJoinClass>Mit ID beitreten</button></div></div>`,()=>{document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{S.cls=S.classes.find(x=>x.id===b.dataset.c);localStorage.cls=S.cls.id;$('modal').innerHTML='';await classData();render()});$('btnCreateClass').onclick=createClassModal;$('btnJoinClass').onclick=joinClassModal})}
function createClassModal(){modal('Klasse erstellen',`<form id=f class=form><div class=field><label>Name der Klasse</label><input id=cn required></div><div class=field><label>Beschreibung (optional)</label><input id=cd></div><button class="btn primary" style="margin-top:10px">Erstellen</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let r=doc(collection(db,'classes'));await setDoc(r,{name:$('cn').value.trim(),description:$('cd').value.trim(),memberIds:[S.u.uid],adminIds:[S.u.uid],createdBy:S.u.uid,createdAt:serverTimestamp()});$('modal').innerHTML='';await load();render()}})}
function joinClassModal(){modal('Klasse beitreten',`<form id=f class=form><div class=field><label>Klassen-ID</label><input id=cid required></div><p class=muted>Die Klassen-ID bekommst du von einem Klassen-Admin.</p><div id=e></div><button class="btn primary" style="margin-top:10px">Anfrage senden</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let cid=$('cid').value.trim();try{let ref=doc(db,'classes',cid);let snap=await getDoc(ref);if(!snap.exists())throw Error('Klasse nicht gefunden.');if((snap.data().memberIds||[]).includes(S.u.uid))throw Error('Du bist bereits drin.');await addDoc(collection(db,'joinRequests'),{classId:cid,className:snap.data().name,uid:S.u.uid,name:S.ud.name,status:'pending',createdAt:serverTimestamp()});$('modal').innerHTML='';alert('Beitrittsanfrage gesendet! Ein Admin muss dich freischalten.')}catch(x){$('e').innerHTML=`<div class="msg err">${err(x)}</div>`}}})}
function lessonModal(){modal('Stunde hinzufügen',`<form id=f class="form two"><div class=field><label>Tag</label><select id=w>${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'].map((x,i)=>`<option value=${i}>${x}</option>`).join('')}</select></div><div class=field><label>Stunde (1-10)</label><input id=p type=number min=1 required></div><div class=field><label>Uhrzeit (z.B. 08:00)</label><input id=t></div><div class=field><label>Fach</label><input id=s required></div><div class=field><label>Lehrer</label><input id=l></div><div class=field><label>Raum</label><input id=r></div><button class="btn primary" style="grid-column:1/-1;margin-top:10px">Speichern</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,'classes',S.cls.id,'lessons'),{weekday:+$('w').value,period:+$('p').value,time:$('t').value,subject:$('s').value.trim(),teacher:$('l').value.trim(),room:$('r').value.trim()});$('modal').innerHTML='';await classData();admin()}})}

onAuthStateChanged(auth,async u=>{
  S.u=u;S.mode='login';
  if(!u){render();return}
  $('root').innerHTML='<div class="loading">Lade Profil & Klassen...</div>';
  await load();
});
</script>
</body>
</html>
