<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schulplaner</title><style>
:root{--bg:#f5f6fb;--card:#fff;--text:#172033;--muted:#737b8c;--line:#e3e6ee;--accent:#6657e8;--red:#e5484d;--green:#238b57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:76px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 9px;z-index:5}.logo{width:48px;height:48px;border-radius:16px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900;font-size:23px;margin-bottom:22px}.nav{display:grid;gap:8px;width:100%}.nav button{height:48px;border:0;border-radius:14px;background:transparent;font-size:21px;color:#71798b}.nav button.active,.nav button:hover{background:#eeecff;color:var(--accent)}.main{margin-left:76px;max-width:1250px;padding:26px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:27px}.user{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px #20243a0b}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title h2{margin:0;font-size:18px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.lesson,.box{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fafbfe}.lesson strong{display:block;margin:4px 0}.now{border-color:var(--accent);background:#f1efff}.tasks{display:grid;gap:8px}.task{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:11px}.task.urgent{background:#fff1f1;border-color:#efaaad}.task.done{opacity:.5;text-decoration:line-through}.check{width:24px;height:24px;border-radius:7px;border:2px solid #c7ccd7;background:white;flex:none}.check.on{background:var(--green);color:white;border-color:var(--green)}.taskmain{flex:1}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf0f5;font-size:11px;font-weight:700}.badge.red{background:#ffe1e2;color:#b3262c}.badge.group{background:#e7f0ff;color:#3262a6}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750;background:#eceef4;color:#303849;cursor:pointer}.btn.primary{background:var(--accent);color:white}.btn.green{background:#ddf4e7;color:#176e44}.btn.red{background:#ffe2e3;color:#ae252b}.form{display:grid;gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d7dbe5;border-radius:10px;background:#fff}.two{grid-template-columns:1fr 1fr}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.day{margin:0 0 14px}.day h3{font-size:13px;color:#565e6e}.pack{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:12px}.pack.done{opacity:.5;text-decoration:line-through}.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.group{border:1px solid var(--line);border-radius:16px;padding:15px}.modalbg{position:fixed;inset:0;background:#11172a88;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:white;border-radius:22px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 10%,#e6e2ff,transparent 35%),#f5f6fb}.authbox{width:min(900px,100%);background:#fff;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 30px 80px #20243a22}.hero{padding:42px;background:linear-gradient(145deg,#6657e8,#8378f1);color:white}.hero h1{font-size:42px;line-height:1;margin:0 0 14px}.hero p{line-height:1.6;opacity:.9}.authform{padding:38px}.link{background:none;border:0;color:var(--accent);font-weight:750;cursor:pointer}.msg{padding:10px;border-radius:10px;font-size:13px}.err{background:#ffe5e5;color:#a5242a}.ok{background:#e1f6e9;color:#176e44}.messages{height:52vh;overflow:auto;background:#f8f9fc;border-radius:14px;padding:10px}.message{max-width:78%;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin:7px 0}.message.mine{margin-left:auto;background:#eeecff}.message small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.message img{max-width:100%;border-radius:10px;margin-top:6px}@media(max-width:750px){.side{width:62px}.main{margin-left:62px;padding:18px}.authbox{grid-template-columns:1fr}.hero{display:none}.two{grid-template-columns:1fr}.top h1{font-size:22px}}
</style></head><body><div id="root"></div><div id="modal"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,orderBy,limitToLast,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyDufHoBggthiPADhYfpNNQ6QZ6GHF1NooD0',authDomain:'schulplaner-lenny.firebaseapp.com',projectId:'schulplaner-lenny',messagingSenderId:'1043062762648',appId:'1:1043062762648:web:c9b1eb13954025fc42b4ed',measurementId:'G-EQ8E8Z1FFV'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(console.error);

const S={u:null,ud:null,view:'home',classes:[],cls:null,lessons:[],hw:[],pack:[],groups:[],gm:new Set(),inv:[],chat:null,stop:null,mode:'login'};
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),add=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},wd=d=>new Date(d+'T12:00:00').getDay(),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit'});
function err(e){return esc(e?.message||e)}
function sys(){return!!S.ud?.systemAdmin}
function cad(){return sys()||!!S.cls?.adminIds?.includes(S.u.uid)}

function authPage(){let l=S.mode==='login';$('root').innerHTML=`<div class=auth><div class=authbox><div class=hero><h1>Schulplaner</h1><p>Stundenplan, Hausaufgaben, Packliste und Gruppen an einem Ort.</p><p>Deine persönlichen Sachen bleiben privat. Geteilt wird nur innerhalb deiner Gruppen.</p></div><div class=authform><h2>${l?'Willkommen zurück':'Konto erstellen'}</h2><p class=muted>${l?'Melde dich an.':'Neue Konten müssen vom Inhaber freigeschaltet werden.'}</p><form id=af class=form>${!l?'<div class=field><label>Name</label><input id=name required></div>':''}<div class=field><label>E-Mail</label><input id=email type=email required></div><div class=field><label>Passwort</label><input id=pw type=password minlength=6 required></div>${!l?'<div class=field><label>Passwort wiederholen</label><input id=pw2 type=password minlength=6 required></div>':''}<div id=am></div><button class="btn primary">${l?'Anmelden':'Konto erstellen'}</button></form><p class=muted>${l?'Noch kein Konto?':'Schon registriert?'} <button class=link id=sw>${l?'Konto erstellen':'Anmelden'}</button></p></div></div></div>`;$('sw').onclick=()=>{S.mode=l?'register':'login';authPage()};$('af').onsubmit=async e=>{e.preventDefault();try{let email=$('email').value.trim(),pw=$('pw').value;if(l)await signInWithEmailAndPassword(auth,email,pw);else{if(pw!==$('pw2').value)throw Error('Die Passwörter stimmen nicht überein.');let r=await createUserWithEmailAndPassword(auth,email,pw);await setDoc(doc(db,'users',r.user.uid),{name:$('name').value.trim(),email,approved:false,systemAdmin:false,packMode:'evening',createdAt:serverTimestamp()});await setDoc(doc(db,'profiles',r.user.uid),{name:$('name').value.trim(),email})}}catch(e){$('am').innerHTML=`<div class="msg err">${err(e)}</div>`}}}
async function load(){let us=await getDoc(doc(db,'users',S.u.uid));S.ud=us.data();if(!S.ud)return;if(!S.ud.approved){render();return}let a=await getDocs(query(collection(db,'classes'),where('memberIds','array-contains',S.u.uid))),b=await getDocs(query(collection(db,'classes'),where('adminIds','array-contains',S.u.uid))),m=new Map();[...a.docs,...b.docs].forEach(d=>m.set(d.id,{id:d.id,...d.data()}));S.classes=[...m.values()];S.cls=S.classes.find(x=>x.id===localStorage.cls)||S.classes[0]||null;if(S.cls)localStorage.cls=S.cls.id;await classData();render()}
async function classData(){S.lessons=[];S.hw=[];S.pack=[];S.groups=[];S.gm=new Set();S.inv=[];if(!S.cls)return;let c=S.cls.id;let [l,h,p,g,i]=await Promise.all([getDocs(collection(db,'classes',c,'lessons')),getDocs(collection(db,'users',S.u.uid,'homework')),getDocs(collection(db,'users',S.u.uid,'pack')),getDocs(query(collection(db,'groups'),where('classId','==',c))),getDocs(query(collection(db,'groupInvites'),where('toUid','==',S.u.uid)))]);S.lessons=l.docs.map(d=>({id:d.id,...d.data()}));S.hw=h.docs.map(d=>({id:d.id,scope:'personal',...d.data()}));S.pack=p.docs.map(d=>({id:d.id,...d.data()}));S.groups=g.docs.map(d=>({id:d.id,...d.data()}));S.inv=i.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');for(let x of S.groups){if((await getDoc(doc(db,'groups',x.id,'members',S.u.uid))).exists())S.gm.add(x.id)}for(let x of S.groups.filter(x=>S.gm.has(x.id))){let h=await getDocs(collection(db,'groups',x.id,'homework'));h.forEach(d=>S.hw.push({id:d.id,scope:'group',groupId:x.id,groupName:x.name,...d.data()}))}S.hw.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'))}
function nextLesson(subject,from=today()){for(let n=0;n<14;n++){let d=add(from,n),w=wd(d);let l=S.lessons.filter(x=>Number(x.weekday)===w-1).sort((a,b)=>a.period-b.period).find(x=>x.subject?.toLowerCase()===subject?.toLowerCase());if(l)return{date:d,l}}return null}
function urgent(h){if(h.done)return false;if(h.dueDate&&h.dueDate<=today())return true;let n=nextLesson(h.subject);return n&&(n.date===today()||n.date===add(today(),1))}
function task(h){return`<div class="task ${urgent(h)?'urgent':''} ${h.done?'done':''}"><button class="check ${h.done?'on':''}" data-check="${h.scope}|${h.groupId||''}|${h.id}">${h.done?'✓':'□'}</button><div class=taskmain><b>${esc(h.subject)} – ${esc(h.task)}</b><div class=muted>${h.dueDate?fmt(h.dueDate):'Nächste Stunde wird aus dem Stundenplan ermittelt'} · <span class="badge ${h.scope==='group'?'group':''}">${h.scope==='group'?'👥 '+esc(h.groupName):'Persönlich'}</span></div></div></div>`}
function bindChecks(){document.querySelectorAll('[data-check]').forEach(b=>b.onclick=async()=>{let[a,g,id]=b.dataset.check.split('|');await updateDoc(a==='personal'?doc(db,'users',S.u.uid,'homework',id):doc(db,'groups',g,'homework',id),{done:true});await load()})}
function home(){let d=today(),ls=S.lessons.filter(x=>Number(x.weekday)===wd(d)-1).sort((a,b)=>a.period-b.period),due=S.hw.filter(urgent),rest=S.hw.filter(x=>!x.done&&!urgent(x)),p=S.pack.filter(x=>x.date===add(d,1)||x.repeatDays?.includes(wd(add(d,1))));$('content').innerHTML=`<div class=card><div class=title><h2>📅 ${fmt(d)}</h2><span class=muted>${S.cls?esc(S.cls.name):'Keine Klasse gewählt'}</span></div>${ls.length?`<div class=grid>${ls.map(x=>`<div class=lesson><small>${x.period}. Stunde · ${esc(x.time||'')}</small><strong>${esc(x.subject)}</strong><small>${esc(x.teacher||'')} ${esc(x.room||'')}</small></div>`).join('')}</div>`:'<div class=empty>Kein Stundenplan für heute.</div>'}</div><div class=card><div class=title><h2>🔴 Jetzt fällig</h2><span class="badge red">${due.length}</span></div>${due.length?`<div class=tasks>${due.map(task).join('')}</div>`:'<div class=empty>Alles erledigt.</div>'}</div><div class=card><div class=title><h2>📚 Weitere Hausaufgaben</h2><button class="btn primary" id=ah>+ Hausaufgabe</button></div>${grouped(rest)}</div><div class=card><div class=title><h2>🎒 Für morgen</h2><button class="btn primary" id=ap>+ Sache</button></div>${p.length?`<div class=tasks>${p.map(pack).join('')}</div>`:'<div class=empty>Nichts für morgen eingetragen.</div>'}</div>`;$('ah').onclick=()=>hwModal();$('ap').onclick=()=>packModal();bindChecks()}
function grouped(a){if(!a.length)return'<div class=empty>Keine weiteren offenen Aufgaben.</div>';let m={};a.forEach(x=>(m[x.dueDate||'9999']??=[]).push(x));return Object.keys(m).sort().map(k=>`<div class=day><h3>${k==='9999'?'Ohne Datum':fmt(k)}</h3><div class=tasks>${m[k].map(task).join('')}</div></div>`).join('')}
function pack(p){return`<div class="pack ${p.done?'done':''}"><button class="check ${p.done?'on':''}" data-pack="${p.id}">${p.done?'✓':'□'}</button><div><b>${esc(p.item)}</b><div class=muted>${p.repeatDays?.length?'Wiederholt: '+p.repeatDays.map(x=>['So','Mo','Di','Mi','Do','Fr','Sa'][x]).join(', '):p.date?fmt(p.date):'Einmalig'} · ${p.mode==='morning'?'morgens':'abends vorher'}</div></div></div>`}
function bindPack(){document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',S.u.uid,'pack',b.dataset.pack),{done:!b.classList.contains('on')});await load()})}
function personal(){ $('content').innerHTML=`<div class=card><div class=title><h2>👤 Persönlich</h2><div class=actions><button class="btn primary" id=ph>+ Hausaufgabe</button><button class="btn primary" id=pp>+ Packliste</button></div></div><p class=muted>Nur du kannst diese Inhalte sehen.</p></div><div class=card><h2>Hausaufgaben</h2>${grouped(S.hw.filter(x=>x.scope==='personal'&&!x.done))}</div><div class=card><h2>Packliste</h2><div class=tasks>${S.pack.map(pack).join('')||'<div class=empty>Noch nichts.</div>'}</div></div>`;$('ph').onclick=()=>hwModal();$('pp').onclick=()=>packModal();bindChecks();bindPack()}
function groups(){if(!S.cls){$('content').innerHTML='<div class=card><div class=empty>Wähle zuerst eine Klasse.</div></div>';return}let gs=S.groups.filter(g=>S.gm.has(g.id));$('content').innerHTML=`<div class=card><div class=title><h2>👥 Gruppen</h2>${cad()?'<button class="btn primary" id=ng>+ Gruppe</button>':''}</div>${gs.length?`<div class=groups>${gs.map(g=>`<div class=group><h3>${esc(g.name)}</h3><p class=muted>${esc(g.description||'Gemeinsamer Bereich')}</p><button class="btn primary" data-g="${g.id}">Öffnen</button></div>`).join('')}</div>`:'<div class=empty>Du bist in keiner Gruppe.</div>'}</div>`;if(cad())$('ng').onclick=groupModal;document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.chat=b.dataset.g;groupView()})}
function groupView(){let g=S.groups.find(x=>x.id===S.chat);$('content').innerHTML=`<div class=card><div class=title><h2>👥 ${esc(g.name)}</h2><button class=btn id=back>← Gruppen</button></div><div class=actions><button class=btn id=gc>💬 Chat</button><button class=btn id=gh>✓ Hausaufgaben</button><button class=btn id=gp>🎒 Packliste</button><button class=btn id=gm>Mitglieder</button></div><div id=gpane style="margin-top:15px"></div></div>`;$('back').onclick=()=>{S.chat=null;groups()};$('gc').onclick=()=>chat();$('gh').onclick=()=>groupHw();$('gp').onclick=()=>groupPack();$('gm').onclick=()=>members();chat()}
function chat(){let g=S.chat;if(S.stop)S.stop();$('gpane').innerHTML=`<div class=messages id=msgs></div><form id=cf class=actions style="margin-top:9px"><input id=ct style="flex:1;min-width:180px;padding:11px;border:1px solid var(--line);border-radius:10px" maxlength=5000 placeholder="Nachricht…"><input id=ci type=file accept=image/*><button class="btn primary">Senden</button></form>`;S.stop=onSnapshot(query(collection(db,'groups',g,'messages'),orderBy('createdAt','asc'),limitToLast(100)),s=>{$('msgs').innerHTML=s.docs.map(d=>{let x=d.data();return`<div class="message ${x.uid===S.u.uid?'mine':''}"><small>${esc(x.name||'Mitglied')}</small>${esc(x.text||'')}${x.imageData?`<img src="${x.imageData}">`:''}</div>`}).join('')||'<div class=empty>Noch keine Nachrichten.</div>';$('msgs').scrollTop=$('msgs').scrollHeight});$('cf').onsubmit=async e=>{e.preventDefault();let text=$('ct').value.trim(),f=$('ci').files[0],img=f?await imageData(f):null;if(!text&&!img)return;await addDoc(collection(db,'groups',g,'messages'),{uid:S.u.uid,name:S.ud.name,text,imageData:img,createdAt:serverTimestamp()});$('ct').value='';$('ci').value=''}}
async function imageData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q=.58,d=c.toDataURL('image/jpeg',q);while(d.length>350000&&q>.2){q-=.05;d=c.toDataURL('image/jpeg',q)}d.length>350000?rej(Error('Bild ist zu groß. Bitte ein kleineres Bild wählen.')):res(d)};i.src=r.result};r.readAsDataURL(f)})}
function groupHw(){let hs=S.hw.filter(x=>x.scope==='group'&&x.groupId===S.chat&&!x.done);$('gpane').innerHTML=`<div class=title><h3>Geteilte Hausaufgaben</h3><button class="btn primary" id=x>+ Aufgabe</button></div>${hs.length?`<div class=tasks>${hs.map(task).join('')}</div>`:'<div class=empty>Keine offenen Aufgaben.</div>'}`;$('x').onclick=()=>hwModal(S.chat);bindChecks()}
async function groupPack(){let s=await getDocs(collection(db,'groups',S.chat,'pack'));$('gpane').innerHTML=`<div class=title><h3>Geteilte Packliste</h3><button class="btn primary" id=x>+ Sache</button></div><div class=tasks id=gplist>${s.docs.map(d=>pack({id:d.id,...d.data()})).join('')||'<div class=empty>Noch nichts.</div>'}</div>`;$('x').onclick=()=>packModal(S.chat);document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'groups',S.chat,'pack',b.dataset.pack),{done:!b.classList.contains('on')});groupPack()})}
async function members(){let s=await getDocs(collection(db,'groups',S.chat,'members'));let rows=await Promise.all(s.docs.map(async d=>{let p=await getDoc(doc(db,'profiles',d.id));return{name:p.data()?.name||d.id,id:d.id,role:d.data().role}}));$('gpane').innerHTML=`<div class=title><h3>Mitglieder</h3><button class="btn primary" id=iv>+ Einladen</button></div>${rows.map(x=>`<div class=box style="margin:7px 0"><b>${esc(x.name)}</b><div class=muted>${x.role==='admin'?'Gruppenadmin':'Mitglied'}</div></div>`).join('')}`;$('iv').onclick=()=>inviteModal()}
function inbox(){ $('content').innerHTML=`<div class=card><div class=title><h2>💬 Nachrichten</h2><span class=badge>${S.inv.length} offen</span></div><p class=muted>Einladungen und Systemnachrichten erscheinen hier. Gruppenchats befinden sich ausschließlich in den Gruppen.</p>${S.inv.map(i=>`<div class=box><b>👥 ${esc(i.groupName)}</b><p>${esc(i.fromName)} möchte dich einladen.</p><div class=actions><button class="btn green" data-ai="${i.id}">Annehmen</button><button class="btn red" data-di="${i.id}">Ablehnen</button></div></div>`).join('')||'<div class=empty>Keine neuen Einladungen.</div>'}</div>`;document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>answer(b.dataset.ai,true));document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>answer(b.dataset.di,false))}
async function answer(id,yes){let i=S.inv.find(x=>x.id===id);await updateDoc(doc(db,'groupInvites',id),{status:yes?'accepted':'declined',answeredAt:serverTimestamp()});if(yes)await setDoc(doc(db,'groups',i.groupId,'members',S.u.uid),{uid:S.u.uid,role:'member',joinedAt:serverTimestamp()});await load();S.view='inbox';render()}
function timetable(){let d=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];$('content').innerHTML=`<div class=card><div class=title><h2>📅 ${esc(S.cls?.name||'Stundenplan')}</h2><button class=btn id=cc>Klasse wechseln</button></div>${d.map((x,i)=>`<div class=box style="margin:9px 0"><b>${x}</b>${S.lessons.filter(l=>Number(l.weekday)===i).sort((a,b)=>a.period-b.period).map(l=>`<div style="padding:8px 0;border-top:1px solid var(--line)">${l.period}. ${esc(l.subject)} <span class=muted>${esc(l.time||'')} ${esc(l.teacher||'')} ${esc(l.room||'')}</span></div>`).join('')||'<div class=muted style="padding-top:8px">Keine Einträge</div>'}</div>`).join('')}</div>`;$('cc').onclick=classModal}
function admin(){let h='';if(sys())h+=`<div class=card><h2>👑 Benutzer</h2><div id=users>Lade…</div></div><div class=card><h2>🏫 Klassenanträge</h2><div id=req>Lade…</div></div><div class=card><h2>🏫 Klasse erstellen</h2><button class="btn primary" id=nc>+ Klasse</button></div>`;if(S.cls&&cad())h+=`<div class=card><h2>⚙️ ${esc(S.cls.name)}</h2><button class="btn primary" id=nl>+ Stunde</button><div style="margin-top:12px">${S.lessons.map(l=>`<div class=box style="margin:6px 0">${l.period}. ${esc(l.subject)} · ${esc(l.teacher||'')} · ${esc(l.room||'')} <button class="btn red" data-dl="${l.id}">Löschen</button></div>`).join('')}</div></div>`;$('content').innerHTML=h||'<div class=card><div class=empty>Keine Verwaltung.</div></div>';if(sys()){getDocs(collection(db,'users')).then(s=>$('users').innerHTML=s.docs.map(d=>{let x=d.data();return`<div class=box style="margin:6px 0"><b>${esc(x.name||x.email)}</b> <span class=muted>${esc(x.email)}</span> ${x.approved?'<span class=badge>aktiv</span>':`<button class="btn green" data-au="${d.id}">Freischalten</button>`}</div>`}).join(''));getDocs(collection(db,'classRequests')).then(s=>$('req').innerHTML=s.docs.filter(d=>d.data().status==='pending').map(d=>{let x=d.data();return`<div class=box style="margin:6px 0"><b>${esc(x.name)}</b> – ${esc(x.requesterName)} <button class="btn green" data-ar="${d.id}">Annehmen</button><button class="btn red" data-rr="${d.id}">Ablehnen</button></div>`}).join('')||'<div class=empty>Keine offenen Anträge.</div>');$('nc').onclick=classModal;document.querySelectorAll('[data-au]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',b.dataset.au),{approved:true});load()});document.querySelectorAll('[data-ar]').forEach(b=>b.onclick=()=>approveReq(b.dataset.ar));document.querySelectorAll('[data-rr]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'classRequests',b.dataset.rr),{status:'rejected'});admin()})}if(S.cls&&cad()){$('nl').onclick=lessonModal;document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,'classes',S.cls.id,'lessons',b.dataset.dl));load()})}}
function render(){if(!S.u){authPage();return}if(!S.ud?.approved){$('root').innerHTML='<div class=auth><div class=card style="max-width:460px;text-align:center"><h2>Konto wartet auf Freischaltung</h2><p class=muted>Der Inhaber muss dein Konto zuerst freischalten.</p><button class=btn id=lo>Abmelden</button></div></div>';$('lo').onclick=()=>signOut(auth);return}$('root').innerHTML=`<div class=app><aside class=side><div class=logo>S</div><div class=nav>${[['home','🏠'],['timetable','📅'],['homework','✓'],['pack','🎒'],['personal','👤'],['groups','👥'],['inbox','💬'],...(sys()||cad()?[['admin','⚙️']]:[])].map(x=>`<button data-v="${x[0]}">${x[1]}</button>`).join('')}</div></aside><main class=main><div class=top><div><h1>${({home:'Heute',timetable:'Stundenplan',homework:'Hausaufgaben',pack:'Packliste',personal:'Persönlich',groups:'Gruppen',inbox:'Nachrichten',admin:'Verwaltung'})[S.view]}</h1><span class=muted>${S.cls?'Klasse: '+esc(S.cls.name):'Keine Klasse gewählt'}</span></div><div class=user>${esc(S.ud.name||S.ud.email)} <button class="btn primary" id="topClassBtn" style="padding:4px 8px; font-size:12px; margin-left:8px;">${S.cls?'Wechseln':'Klasse wählen'}</button></div></div><div id=content></div></main></div>`;document.querySelectorAll('[data-v]').forEach(b=>{b.classList.toggle('active',b.dataset.v===S.view);b.onclick=async()=>{S.view=b.dataset.v;await load();render()}});if($('topClassBtn'))$('topClassBtn').onclick=classModal;if(S.view==='home')home();if(S.view==='timetable')timetable();if(S.view==='homework'){$('content').innerHTML=`<div class=card><div class=title><h2>Meine Hausaufgaben</h2><button class="btn primary" id=ah>+ Hausaufgabe</button></div>${grouped(S.hw.filter(x=>x.scope==='personal'&&!x.done))}</div>`;$('ah').onclick=()=>hwModal();bindChecks()}if(S.view==='pack'){$('content').innerHTML=`<div class=card><div class=title><h2>Meine Packliste</h2><button class="btn primary" id=ap>+ Sache</button></div><p class=muted>Wiederholungen sind möglich, z. B. Mathebuch jeden Montag und Dienstag.</p><div class=tasks>${S.pack.map(pack).join('')||'<div class=empty>Noch nichts.</div>'}</div></div><div class=card><h3>Erinnerung</h3><button class="btn ${S.ud.packMode==='morning'?'primary':''}" id=morning>Morgens</button> <button class="btn ${S.ud.packMode!=='morning'?'primary':''}" id=evening>Abends vorher</button></div>`;$('ap').onclick=()=>packModal();$('morning').onclick=async()=>{await updateDoc(doc(db,'users',S.u.uid),{packMode:'morning'});load()};$('evening').onclick=async()=>{await updateDoc(doc(db,'users',S.u.uid),{packMode:'evening'});load()};bindPack()}if(S.view==='personal')personal();if(S.view==='groups')groups();if(S.view==='inbox')inbox();if(S.view==='admin')admin()}
function modal(title,body,cb){$('modal').innerHTML=`<div class=modalbg><div class=modal><div class=title><h2>${title}</h2><button class=btn id=mx>✕</button></div>${body}</div></div>`;$('mx').onclick=()=>$('modal').innerHTML='';cb?.()}
function hwModal(gid=null){modal(gid?'Gruppen-Hausaufgabe':'Hausaufgabe',`<form id=f class=form><div class=field><label>Fach</label><input id=s required></div><div class=field><label>Aufgabe / Seiten</label><textarea id=t required></textarea></div><div class=field><label>Fällig am</label><input id=d type=date></div><button class="btn primary">Speichern</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let x={subject:$('s').value.trim(),task:$('t').value.trim(),dueDate:$('d').value||null,done:false,ownerId:S.u.uid,createdAt:serverTimestamp()};if(gid){x.shared=true;await addDoc(collection(db,'groups',gid,'homework'),x)}else await addDoc(collection(db,'users',S.u.uid,'homework'),x);$('modal').innerHTML='';load()}})}
function packModal(gid=null){modal(gid?'Geteilte Gruppen-Packliste':'Meine Packliste',`<form id=f class=form><div class=field><label>Sache</label><input id=i required placeholder="Mathebuch"></div><div class=field><label>Einmalig am (optional)</label><input id=d type=date></div><div class=field><label>Wiederholung</label><div class=actions>${['So','Mo','Di','Mi','Do','Fr','Sa'].map((x,i)=>`<label class=btn><input type=checkbox class=day value=${i}>${x}</label>`).join('')}</div></div><div class=field><label>Erinnerung</label><select id=m><option value=evening>Abends vorher</option><option value=morning>Morgens am selben Tag</option></select></div><button class="btn primary">Speichern</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let x={item:$('i').value.trim(),date:$('d').value||null,repeatDays:[...document.querySelectorAll('.day:checked')].map(x=>+x.value),mode:$('m').value,done:false,ownerId:S.u.uid,createdAt:serverTimestamp()};await addDoc(collection(db,gid?'groups/'+gid+'/pack':'users/'+S.u.uid+'/pack'),x);$('modal').innerHTML='';load()}})}
function groupModal(){modal('Neue Gruppe',`<form id=f class=form><div class=field><label>Name</label><input id=n required></div><div class=field><label>Beschreibung</label><input id=d></div><button class="btn primary">Erstellen</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let r=doc(collection(db,'groups'));await setDoc(r,{classId:S.cls.id,name:$('n').value.trim(),description:$('d').value.trim(),adminIds:[S.u.uid],createdBy:S.u.uid,createdAt:serverTimestamp()});await setDoc(doc(db,'groups',r.id,'members',S.u.uid),{uid:S.u.uid,role:'admin',joinedAt:serverTimestamp()});$('modal').innerHTML='';load()}})}
async function inviteModal(){let ids=(S.cls.memberIds||[]).filter(x=>x!==S.u.uid),ps=await Promise.all(ids.map(async id=>{let p=await getDoc(doc(db,'profiles',id));return{id,name:p.data()?.name||id}}));modal('Person einladen',`<form id=f class=form><div class=field><label>Klassenmitglied</label><select id=t>${ps.map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select></div><div id=e></div><button class="btn primary">Einladung senden</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let to=$('t').value,id=S.chat+'_'+to;try{let old=await getDoc(doc(db,'groupInvites',id));if(old.exists()&&old.data().status==='pending')throw Error('Diese Person hat bereits eine offene Einladung.');if(old.exists()&&old.data().createdAt&&Date.now()-old.data().createdAt.toDate().getTime()<300000)throw Error('Bitte 5 Minuten warten, bevor du diese Person erneut einlädst.');await setDoc(doc(db,'groupInvites',id),{classId:S.cls.id,groupId:S.chat,groupName:S.groups.find(x=>x.id===S.chat).name,toUid:to,fromUid:S.u.uid,fromName:S.ud.name,status:'pending',createdAt:serverTimestamp()});$('modal').innerHTML=''}catch(x){$('e').innerHTML=`<div class="msg err">${err(x)}</div>`}}})}
function classModal(){let available=S.classes;modal('Klasse auswählen / Beitreten',`<div class=groups>${available.map(c=>`<div class=group><h3>${esc(c.name)}</h3><p class=muted>${esc(c.description||'')}</p><button class="btn primary" data-c=${c.id}>Auswählen</button></div>`).join('')||'<div class=empty>Du bist noch keiner Klasse beigetreten.</div>'}</div><div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line)"><h3>Klassen-Optionen</h3><div class=actions><button class="btn primary" id=btnReqClass>+ Klasse beantragen</button><button class=btn id=btnJoinClass>Mit Code beitreten</button></div></div>`,()=>{document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{S.cls=S.classes.find(x=>x.id===b.dataset.c);localStorage.cls=S.cls.id;$('modal').innerHTML='';load()});$('btnReqClass').onclick=requestClassModal;$('btnJoinClass').onclick=joinClassModal})}
function requestClassModal(){modal('Neue Klasse beantragen',`<form id=f class=form><div class=field><label>Name der Klasse</label><input id=cn required></div><div class=field><label>Beschreibung (optional)</label><input id=cd></div><button class="btn primary">Beantragen</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,'classRequests'),{name:$('cn').value.trim(),description:$('cd').value.trim(),requesterId:S.u.uid,requesterName:S.ud.name,status:'pending',createdAt:serverTimestamp()});$('modal').innerHTML='';alert('Klassenantrag gesendet! Ein Admin muss ihn noch freischalten.')}})}
function joinClassModal(){modal('Klasse beitreten',`<form id=f class=form><div class=field><label>Klassen-ID (Code)</label><input id=cid required></div><p class=muted>Die ID findest du nicht direkt im Admin-Panel (musst du als Admin aus der Datenbank kopieren).</p><button class="btn primary">Beitreten</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();let cid=$('cid').value.trim();try{let ref=doc(db,'classes',cid);let snap=await getDoc(ref);if(!snap.exists())throw Error('Klasse nicht gefunden.');let arr=snap.data().memberIds||[];if(!arr.includes(S.u.uid)){arr.push(S.u.uid);await updateDoc(ref,{memberIds:arr})} $('modal').innerHTML='';await load();render()}catch(err){alert(err.message)}}})}
function lessonModal(){modal('Stunde hinzufügen',`<form id=f class="form two"><div class=field><label>Tag</label><select id=w>${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'].map((x,i)=>`<option value=${i}>${x}</option>`).join('')}</select></div><div class=field><label>Stunde</label><input id=p type=number min=1 required></div><div class=field><label>Uhrzeit</label><input id=t></div><div class=field><label>Fach</label><input id=s required></div><div class=field><label>Lehrer</label><input id=l></div><div class=field><label>Raum</label><input id=r></div><button class="btn primary">Speichern</button></form>`,()=>{$('f').onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,'classes',S.cls.id,'lessons'),{weekday:+$('w').value,period:+$('p').value,time:$('t').value,subject:$('s').value,teacher:$('l').value,room:$('r').value});$('modal').innerHTML='';load()}})}
async function approveReq(id){let s=(await getDoc(doc(db,'classRequests',id))).data(),r=doc(collection(db,'classes'));await setDoc(r,{name:s.name,description:s.description||'',memberIds:[s.requesterId],adminIds:[s.requesterId],createdBy:S.u.uid,createdAt:serverTimestamp()});await updateDoc(doc(db,'classRequests',id),{status:'approved',classId:r.id});load()}
onAuthStateChanged(auth,async u=>{S.u=u;if(!u){render();return}try{await load()}catch(e){$('root').innerHTML=`<div class=auth><div class=card><h2>Fehler</h2><div class="msg err">${err(e)}</div></div></div>`}});
</script></body></html>
